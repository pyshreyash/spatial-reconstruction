[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roomscan"
version = "0.1.0"
description = "Phone capture to dimensioned floor plan with calibrated intervals"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pillow>=10",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
roomscan = "roomscan.cli:main"

[tool.setuptools.packages.find]
include = ["roomscan*"]
